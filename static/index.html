<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>K &amp; T 2do list</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="icon" type="image/png" href="/static/favicon.png" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
</head>
<body>
  <div class="backdrop no-photo" id="backdrop"></div>
  <div class="scrim"></div>

  <div class="lock hidden" id="lock">
    <form class="card lock-card" id="lockForm">
      <h1>K &amp; T</h1>
      <p class="hint">Just for the two of you.</p>
      <input type="password" id="lockPassword" placeholder="Password"
             autocomplete="current-password" spellcheck="false" required />
      <button type="submit" class="primary" id="lockBtn">Come in</button>
      <p class="lock-error hidden" id="lockError"></p>
    </form>
  </div>

  <main class="page" id="page">
    <header class="masthead">
      <div class="titles">
        <h1>K &amp; T</h1>
        <p class="subtitle">things we said we'd do</p>
      </div>
      <label class="frame" title="Click to use your own photo">
        <input type="file" id="bgInput" accept="image/jpeg,image/png,image/webp" hidden />
        <img id="portrait" alt="Katherine and Tahmid" hidden />
        <span class="frame-empty" id="frameEmpty">add<br />your photo</span>
        <span class="frame-hint">change</span>
      </label>
    </header>

    <div class="banner hidden" id="banner"></div>

    <!-- ------------------------------------------------ add ------------- -->
    <section class="card">
      <h2>Add something</h2>
      <p class="hint">Write it however you'd say it. You can put a few things in at once.</p>
      <form id="addForm">
        <div class="speak-wrap">
          <textarea id="ideaText" rows="2"
            placeholder="that ramen place on Queen, and the botanical garden sometime"></textarea>
          <button type="button" class="mic" id="micBtn" title="Say it out loud instead" hidden>
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="2" width="6" height="12" rx="3"></rect>
              <path d="M5 10v1a7 7 0 0 0 14 0v-1"></path>
              <line x1="12" y1="18" x2="12" y2="22"></line>
            </svg>
          </button>
        </div>
        <button type="submit" class="primary" id="addBtn">Add to the list</button>
      </form>
    </section>

    <!-- ------------------------------------------------ plan ------------ -->
    <section class="card">
      <h2>What should we do?</h2>
      <p class="hint">Where you both are right now, and how long you've got.</p>
      <form id="planForm">
        <div class="field-row">
          <label class="field">
            <span>Katherine is at</span>
            <input type="text" id="katherineLoc" placeholder="city, address, or postcode" required />
          </label>
          <label class="field">
            <span>Tahmid is at</span>
            <input type="text" id="tahmidLoc" placeholder="city, address, or postcode" required />
          </label>
        </div>
        <div class="field-row">
          <label class="field">
            <span>Time we have, door to door</span>
            <select id="available">
              <option value="">No limit</option>
              <option value="60">1 hour</option>
              <option value="120">2 hours</option>
              <option value="180">3 hours</option>
              <option value="240">4 hours</option>
              <option value="360">6 hours</option>
              <option value="480">The whole day</option>
            </select>
          </label>
          <label class="field">
            <span>When</span>
            <input type="datetime-local" id="when" />
          </label>
        </div>
        <button type="submit" class="primary" id="planBtn">Pick something for us</button>
      </form>
      <div id="planResult"></div>
    </section>

    <!-- ------------------------------------------------ list ------------ -->
    <section class="card">
      <div class="list-head">
        <h2>The list</h2>
        <label class="toggle">
          <input type="checkbox" id="showDone" />
          <span>Show done</span>
        </label>
      </div>
      <div id="list" class="list"></div>
    </section>

    <footer class="foot">Made for Katherine &amp; Tahmid 💛</footer>
  </main>

  <div class="puppy-yard" id="puppyYard" aria-hidden="true">
    <div class="puppy puppy-golden" id="puppyGolden">

        <title>Golden retriever</title>
        <ellipse class="puppy-ground" cx="90" cy="122" rx="48" ry="6" />
        <g class="puppy-figure">
          <g class="puppy-tail">
            <path fill="#d4924a" d="M40 62 C22 42 8 48 6 64 C4 74 16 78 28 70 C22 80 34 78 40 68 Z" />
            <path fill="#e8b56a" d="M40 62 C26 46 14 50 12 62 C14 70 26 70 36 66 Z" />
          </g>
          <g class="leg leg-back-far">
            <path fill="#c47d38" d="M58 72 l-4 40 a8 6 0 0 0 14 1 l-2 -41 z" />
            <ellipse fill="#b56e30" cx="60" cy="116" rx="9" ry="5" />
          </g>
          <g class="leg leg-front-far">
            <path fill="#c47d38" d="M108 74 l-6 38 a8 6 0 0 0 14 1 l0 -39 z" />

          <ellipse fill="#d4924a" cx="88" cy="68" rx="50" ry="26" />

          <ellipse fill="#f0c57a" cx="102" cy="58" rx="22" ry="16" />

            <path fill="#e8b56a" d="M74 70 l4 42 a8 6 0 0 0 14 0 l-8 -42 z" />
            <ellipse fill="#d4924a" cx="86" cy="116" rx="10" ry="5.5" />
          </g>
          <g class="leg leg-front-near">
            <path fill="#e8b56a" d="M118 72 l6 40 a8 6 0 0 0 14 0 l-8 -40 z" />
            <ellipse fill="#d4924a" cx="132" cy="116" rx="10" ry="5.5" />
          </g>
          <g class="puppy-head">
            <g class="ear ear-far">
              <ellipse fill="#c47d38" cx="126" cy="58" rx="10" ry="18" transform="rotate(-18 126 58)" />
            </g>
            <ellipse fill="#e8b56a" cx="140" cy="50" rx="24" ry="21" />
            <ellipse fill="#f0c57a" cx="146" cy="48" rx="16" ry="14" />

              <ellipse fill="#d4924a" cx="132" cy="56" rx="11" ry="20" transform="rotate(12 132 56)" />

            <ellipse fill="#e8b56a" cx="160" cy="56" rx="16" ry="11" />

            <ellipse fill="#2b2018" cx="146" cy="46" rx="3.2" ry="3.6" />
            <ellipse fill="#fff3e6" cx="147" cy="44.8" rx="1.1" ry="0.9" />

                  d="M158 62 q8 6 14 1" />

          </g>
        </g>
      </svg>
    </div>

    <div class="puppy puppy-poodle" id="puppyPoodle">

        <title>Poodle</title>
        <ellipse class="puppy-ground" cx="92" cy="122" rx="42" ry="6" />
        <g class="puppy-figure">
          <g class="puppy-tail">
            <path fill="#dcc9b6" d="M48 56 C36 44 28 40 22 36" stroke="#dcc9b6" stroke-width="3.5" fill="none" />

            <circle fill="#ead9c8" cx="16" cy="28" r="5.5" />
          </g>
          <g class="leg leg-back-far">

          <g class="leg leg-front-far">

            <path d="M74 72 v40" stroke="#dcc9b6" stroke-width="5.5" stroke-linecap="round" />
            <circle fill="#f6eee4" cx="74" cy="114" r="9" />
          </g>
          <g class="leg leg-front-near">
            <path d="M122 70 v42" stroke="#dcc9b6" stroke-width="5.5" stroke-linecap="round" />
            <circle fill="#f6eee4" cx="124" cy="114" r="9" />
          </g>
          <g class="puppy-head">
            <g class="ear ear-far">
              <ellipse fill="#ead9c8" cx="128" cy="58" rx="9" ry="16" />
            </g>
            <circle fill="#f6eee4" cx="142" cy="42" r="20" />

              <ellipse fill="#e8c4a0" cx="134" cy="56" rx="10" ry="17" />

            <ellipse fill="#dcc9b6" cx="162" cy="50" rx="14" ry="8" />

            <ellipse fill="#2b2018" cx="148" cy="40" rx="3" ry="3.4" />
            <ellipse fill="#fff3e6" cx="148.8" cy="39" rx="1" ry="0.8" />
            <path class="puppy-smile" fill="none" stroke="#2b2018" stroke-width="1.3" stroke-linecap="round"

            <ellipse class="puppy-tongue" fill="#e0897a" cx="168" cy="62" rx="4" ry="4.5" />
          </g>
        </g>
      </svg>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
