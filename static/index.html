<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>K &amp; T 2do list</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="icon" type="image/png" href="/static/favicon.png" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
</head>
<body>
  <div class="backdrop no-photo" id="backdrop"></div>
  <div class="scrim"></div>

  <div class="lock hidden" id="lock">
    <form class="card lock-card" id="lockForm">
      <h1>K &amp; T</h1>
      <p class="hint">Just for the two of you.</p>
      <input type="password" id="lockPassword" placeholder="Password"
             autocomplete="current-password" spellcheck="false" required />
      <button type="submit" class="primary" id="lockBtn">Come in</button>
      <p class="lock-error hidden" id="lockError"></p>
    </form>
  </div>

  <main class="page" id="page">
    <header class="masthead">
      <div class="titles">
        <h1>K &amp; T</h1>
        <p class="subtitle">things we said we'd do</p>
      </div>
      <label class="frame" title="Click to use your own photo">
        <input type="file" id="bgInput" accept="image/jpeg,image/png,image/webp" hidden />
        <img id="portrait" alt="Katherine and Tahmid" hidden />
        <span class="frame-empty" id="frameEmpty">add<br />your photo</span>
        <span class="frame-hint">change</span>
      </label>
    </header>

    <div class="banner hidden" id="banner"></div>

    <!-- ------------------------------------------------ add ------------- -->
    <section class="card">
      <h2>Add something</h2>
      <p class="hint">Write it however you'd say it. You can put a few things in at once.</p>
      <form id="addForm">
        <div class="speak-wrap">
          <textarea id="ideaText" rows="2"
            placeholder="that ramen place on Queen, and the botanical garden sometime"></textarea>
          <button type="button" class="mic" id="micBtn" title="Say it out loud instead" hidden>
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="2" width="6" height="12" rx="3"></rect>
              <path d="M5 10v1a7 7 0 0 0 14 0v-1"></path>
              <line x1="12" y1="18" x2="12" y2="22"></line>
            </svg>
          </button>
        </div>
        <button type="submit" class="primary" id="addBtn">Add to the list</button>
      </form>
    </section>

    <!-- ------------------------------------------------ plan ------------ -->
    <section class="card">
      <h2>What should we do?</h2>
      <p class="hint">Where you both are right now, and how long you've got.</p>
      <form id="planForm">
        <div class="field-row">
          <label class="field">
            <span>Katherine is at</span>
            <input type="text" id="katherineLoc" placeholder="city, address, or postcode" required />
          </label>
          <label class="field">
            <span>Tahmid is at</span>
            <input type="text" id="tahmidLoc" placeholder="city, address, or postcode" required />
          </label>
        </div>
        <div class="field-row">
          <label class="field">
            <span>Time we have, door to door</span>
            <select id="available">
              <option value="">No limit</option>
              <option value="60">1 hour</option>
              <option value="120">2 hours</option>
              <option value="180">3 hours</option>
              <option value="240">4 hours</option>
              <option value="360">6 hours</option>
              <option value="480">The whole day</option>
            </select>
          </label>
          <label class="field">
            <span>When</span>
            <input type="datetime-local" id="when" />
          </label>
        </div>
        <button type="submit" class="primary" id="planBtn">Pick something for us</button>
      </form>
      <div id="planResult"></div>
    </section>

    <!-- ------------------------------------------------ list ------------ -->
    <section class="card">
      <div class="list-head">
        <h2>The list</h2>
        <label class="toggle">
          <input type="checkbox" id="showDone" />
          <span>Show done</span>
        </label>
      </div>
      <div id="list" class="list"></div>
    </section>

    <footer class="foot">Made for Katherine &amp; Tahmid 💛</footer>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
