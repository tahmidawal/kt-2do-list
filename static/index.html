<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>K &amp; T 2do list</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="icon" type="image/png" href="/static/favicon.png" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
</head>
<body>
  <div class="backdrop no-photo" id="backdrop"></div>
  <div class="scrim"></div>

  <div class="lock hidden" id="lock">
    <form class="card lock-card" id="lockForm">
      <h1>K &amp; T</h1>
      <p class="hint">Just for the two of you.</p>
      <input type="password" id="lockPassword" placeholder="Password"
             autocomplete="current-password" spellcheck="false" required />
      <button type="submit" class="primary" id="lockBtn">Come in</button>
      <p class="lock-error hidden" id="lockError"></p>
    </form>
  </div>

  <main class="page" id="page">
    <header class="masthead">
      <div class="titles">
        <h1>K &amp; T</h1>
        <p class="subtitle">things we said we'd do</p>
      </div>
      <label class="frame" title="Click to use your own photo">
        <input type="file" id="bgInput" accept="image/jpeg,image/png,image/webp" hidden />
        <img id="portrait" alt="Katherine and Tahmid" hidden />
        <span class="frame-empty" id="frameEmpty">add<br />your photo</span>
        <span class="frame-hint">change</span>
      </label>
    </header>

    <div class="banner hidden" id="banner"></div>

    <!-- ------------------------------------------------ add ------------- -->
    <section class="card">
      <h2>Add something</h2>
      <p class="hint">Write it however you'd say it. You can put a few things in at once.</p>
      <form id="addForm">
        <div class="speak-wrap">
          <textarea id="ideaText" rows="2"
            placeholder="that ramen place on Queen, and the botanical garden sometime"></textarea>
          <button type="button" class="mic" id="micBtn" title="Say it out loud instead" hidden>
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="2" width="6" height="12" rx="3"></rect>
              <path d="M5 10v1a7 7 0 0 0 14 0v-1"></path>
              <line x1="12" y1="18" x2="12" y2="22"></line>
            </svg>
          </button>
        </div>
        <button type="submit" class="primary" id="addBtn">Add to the list</button>
      </form>
    </section>

    <!-- ------------------------------------------------ plan ------------ -->
    <section class="card">
      <h2>What should we do?</h2>
      <p class="hint">Where you both are right now, and how long you've got.</p>
      <form id="planForm">
        <div class="field-row">
          <label class="field">
            <span>Katherine is at</span>
            <input type="text" id="katherineLoc" placeholder="city, address, or postcode" required />
          </label>
          <label class="field">
            <span>Tahmid is at</span>
            <input type="text" id="tahmidLoc" placeholder="city, address, or postcode" required />
          </label>
        </div>
        <div class="field-row">
          <label class="field">
            <span>Time we have, door to door</span>
            <select id="available">
              <option value="">No limit</option>
              <option value="60">1 hour</option>
              <option value="120">2 hours</option>
              <option value="180">3 hours</option>
              <option value="240">4 hours</option>
              <option value="360">6 hours</option>
              <option value="480">The whole day</option>
            </select>
          </label>
          <label class="field">
            <span>When</span>
            <input type="datetime-local" id="when" />
          </label>
        </div>
        <button type="submit" class="primary" id="planBtn">Pick something for us</button>
      </form>
      <div id="planResult"></div>
    </section>

    <!-- ------------------------------------------------ list ------------ -->
    <section class="card">
      <div class="list-head">
        <h2>The list</h2>
        <label class="toggle">
          <input type="checkbox" id="showDone" />
          <span>Show done</span>
        </label>
      </div>
      <div id="list" class="list"></div>
    </section>

    <footer class="foot">Made for Katherine &amp; Tahmid 💛</footer>
  </main>

  <div class="puppy-yard" id="puppyYard" aria-hidden="true">
    <div class="puppy puppy-golden" id="puppyGolden">
      <svg viewBox="0 0 180 130" role="img">
        <title>Golden retriever</title>
        <defs>
          <linearGradient id="grCoat" x1="40" y1="28" x2="150" y2="108" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#e6c9a4" />
            <stop offset=".4" stop-color="#d0a074" />
            <stop offset="1" stop-color="#8d5e49" />
          </linearGradient>
          <radialGradient id="grHalo" cx="118" cy="42" r="70" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#f4e6d6" stop-opacity=".55" />
            <stop offset="1" stop-color="#d0a074" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="grDepth" x1="70" y1="62" x2="100" y2="104" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#402f2a" stop-opacity="0" />
            <stop offset="1" stop-color="#402f2a" stop-opacity=".28" />
          </linearGradient>
        </defs>
        <ellipse class="puppy-ground" cx="90" cy="122" rx="44" ry="6" />
        <g class="puppy-figure">
          <g class="puppy-tail">
            <path class="puppy-stroke" fill="url(#grCoat)"
                  d="M48 64 C28 42 8 46 6 62 C4 76 22 82 36 74 C26 86 44 82 50 68 Z" />
            <path fill="url(#grHalo)" d="M44 62 C30 50 16 52 14 62 C18 70 30 70 42 66 Z" />
          </g>
          <g class="leg leg-back-far">
            <path class="puppy-stroke" fill="#9d7059" d="M60 76 C58 96 56 110 58 117 C60 120 67 120 68 116 C67 100 66 86 64 76 Z" />
          </g>
          <g class="leg leg-front-far">
            <path class="puppy-stroke" fill="#9d7059" d="M112 76 C109 96 107 110 109 117 C111 120 118 120 119 116 C118 98 116 84 115 76 Z" />
          </g>
          <g class="puppy-torso">
            <path class="puppy-stroke" fill="url(#grCoat)"
                  d="M48 76 C46 58 60 44 84 44 C112 44 134 54 140 70 C144 80 138 92 122 96 C98 102 70 100 56 92 C48 86 46 80 48 76 Z" />
            <path fill="url(#grHalo)" d="M78 48 C104 44 128 54 136 70 C122 56 98 50 78 54 Z" />
            <path fill="url(#grDepth)" d="M58 80 C72 96 112 98 134 82 C116 94 80 96 60 86 Z" />
          </g>
          <g class="leg leg-back-near">
            <path class="puppy-stroke" fill="url(#grCoat)" d="M72 74 C74 94 76 110 80 117 C82 120 91 120 92 115 C88 96 82 80 76 74 Z" />
          </g>
          <g class="leg leg-front-near">
            <path class="puppy-stroke" fill="url(#grCoat)" d="M118 74 C122 94 126 110 130 117 C132 120 141 120 141 115 C135 96 127 82 121 74 Z" />
          </g>
          <g class="puppy-head">
            <g class="ear ear-far">
              <path class="puppy-stroke" fill="#9d7059" d="M122 42 C114 54 114 70 122 80 C130 72 134 54 132 44 Z" />
            </g>
            <path class="puppy-stroke" fill="url(#grCoat)"
                  d="M120 50 C118 32 138 22 156 30 C170 36 176 50 170 60 C164 72 144 74 130 66 C122 60 120 54 120 50 Z" />
            <path fill="url(#grHalo)" d="M136 34 C150 28 164 36 168 48 C156 40 142 38 134 42 Z" />
            <g class="ear ear-near">
              <path class="puppy-stroke" fill="#c18c76" d="M124 40 C116 54 120 74 132 80 C138 66 140 48 134 42 Z" />
            </g>
            <path fill="#d0a074" d="M154 52 C164 50 174 54 174 59 C174 64 164 64 154 60 Z" />
            <ellipse fill="#5c4034" cx="145" cy="45" rx="1.7" ry="2.1" opacity=".7" />
            <ellipse class="puppy-tongue" fill="#c18c76" cx="166" cy="64" rx="3.2" ry="3.6" />
          </g>
        </g>
      </svg>
    </div>

    <div class="puppy puppy-poodle" id="puppyPoodle">
      <svg viewBox="0 0 180 130" role="img">
        <title>Poodle</title>
        <defs>
          <linearGradient id="pdWool" x1="36" y1="18" x2="156" y2="108" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#fbf3ea" />
            <stop offset=".5" stop-color="#f4e6d6" />
            <stop offset="1" stop-color="#c18c76" />
          </linearGradient>
          <radialGradient id="pdHalo" cx="124" cy="36" r="64" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#fff8f0" stop-opacity=".6" />
            <stop offset="1" stop-color="#f4e6d6" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="pdSkin" x1="152" y1="44" x2="176" y2="60" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#e8d3c4" />
            <stop offset="1" stop-color="#c18c76" />
          </linearGradient>
        </defs>
        <ellipse class="puppy-ground" cx="92" cy="122" rx="38" ry="5.5" />
        <g class="puppy-figure">
          <g class="puppy-tail">
            <path fill="none" stroke="#c18c76" stroke-width="2.4" stroke-linecap="round" opacity=".7" d="M50 58 C38 46 30 38 24 30" />
            <path class="puppy-stroke" fill="url(#pdWool)" d="M28 16 C18 18 12 28 15 38 C18 46 30 48 36 40 C42 30 38 16 28 16 Z" />
          </g>
          <g class="leg leg-back-far">
            <path fill="none" stroke="#c18c76" stroke-width="3.2" stroke-linecap="round" opacity=".75" d="M60 74 L58 114" />
            <path class="puppy-stroke" fill="url(#pdWool)" d="M52 108 C50 114 56 121 64 121 C71 121 73 114 69 110 C64 105 55 104 52 108 Z" />
          </g>
          <g class="leg leg-front-far">
            <path fill="none" stroke="#c18c76" stroke-width="3.2" stroke-linecap="round" opacity=".75" d="M112 74 L110 114" />
            <path class="puppy-stroke" fill="url(#pdWool)" d="M104 108 C102 114 108 121 116 121 C123 121 125 114 121 110 C116 105 107 104 104 108 Z" />
          </g>
          <g class="puppy-torso">
            <path class="puppy-stroke" fill="url(#pdWool)"
                  d="M44 68 C38 54 52 42 68 48 C72 36 90 36 94 50 C90 58 80 64 70 66 C56 70 46 74 44 68 Z" />
            <path fill="#e8d3c4" d="M88 62 C98 58 116 58 126 66 C118 70 98 72 88 68 Z" />
            <path class="puppy-stroke" fill="url(#pdWool)"
                  d="M106 52 C98 40 120 32 134 44 C146 54 142 70 126 74 C112 78 106 66 106 52 Z" />
            <path fill="url(#pdHalo)" d="M118 44 C128 40 138 48 140 58 C130 50 118 48 114 52 Z" />
          </g>
          <g class="leg leg-back-near">
            <path fill="none" stroke="#c18c76" stroke-width="3.6" stroke-linecap="round" opacity=".8" d="M74 74 L74 116" />
            <path class="puppy-stroke" fill="url(#pdWool)" d="M67 109 C65 116 71 123 80 123 C89 123 91 116 87 112 C82 107 71 105 67 109 Z" />
          </g>
          <g class="leg leg-front-near">
            <path fill="none" stroke="#c18c76" stroke-width="3.6" stroke-linecap="round" opacity=".8" d="M124 72 L128 116" />
            <path class="puppy-stroke" fill="url(#pdWool)" d="M121 109 C119 116 125 123 134 123 C143 123 145 116 141 112 C136 107 125 105 121 109 Z" />
          </g>
          <g class="puppy-head">
            <g class="ear ear-far">
              <path class="puppy-stroke" fill="#e8d3c4" d="M126 42 C120 54 124 70 134 74 C138 62 138 48 134 42 Z" />
            </g>
            <path class="puppy-stroke" fill="url(#pdWool)"
                  d="M124 42 C120 24 138 14 154 22 C168 30 170 48 158 58 C148 64 130 60 124 50 C122 46 122 44 124 42 Z" />
            <path class="topknot puppy-stroke" fill="#fbf3ea"
                  d="M136 12 C126 16 124 28 132 34 C140 20 154 20 158 30 C162 20 152 8 138 10 Z" />
            <path fill="url(#pdHalo)" d="M140 24 C150 22 160 30 160 40 C150 32 140 28 136 32 Z" />
            <g class="ear ear-near">
              <path class="puppy-stroke" fill="#c18c76" opacity=".7" d="M126 40 C118 54 124 72 136 76 C140 62 140 46 136 40 Z" />
            </g>
            <path fill="url(#pdSkin)" d="M154 46 C166 42 176 48 176 54 C176 60 166 60 154 56 Z" />
            <ellipse fill="#5c4034" cx="146" cy="40" rx="1.6" ry="2" opacity=".65" />
            <ellipse class="puppy-tongue" fill="#c18c76" cx="168" cy="60" rx="3" ry="3.4" />
          </g>
        </g>
      </svg>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
